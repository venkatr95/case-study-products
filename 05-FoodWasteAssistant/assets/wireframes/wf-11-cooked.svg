<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-11 Mark cooked</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-11 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Mark cooked</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Update the pantry?</text>
<text x="64" y="192" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Spinach and chickpea skillet · 2 servings.</text>
<text x="64" y="212" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Change any amount.</text>
<rect x="64" y="240" width="334" height="36" rx="8" fill="#fffcf7" stroke="#cfc6b8"/>
<text x="76" y="264" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Spinach · subtract 150 g · 200 g becomes 50 g</text>
<rect x="64" y="286" width="334" height="36" rx="8" fill="#eceae4" stroke="#1c2822"/>
<text x="76" y="310" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Proposed first because the date is in the window.</text>
<rect x="64" y="332" width="334" height="36" rx="8" fill="#fffcf7" stroke="#cfc6b8"/>
<text x="76" y="356" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Garlic · subtract 1 piece · this removes the item</text>
<text x="64" y="378" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">Salt, pepper, and water are not</text>
<text x="64" y="398" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">subtracted.</text>
<rect x="64" y="426" width="334" height="44" rx="22" fill="#1c2822" stroke="#1c2822"/>
<text x="231" y="454" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fffcf7">Update pantry</text>
<rect x="64" y="482" width="334" height="44" rx="22" fill="#fffcf7" stroke="#1c2822"/>
<text x="231" y="510" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Cancel</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. Amounts are proposals. Each row can be</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">skipped or removed.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. Dated items are proposed before undated</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">matches.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Undo is offered after the update.</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. Covers FR-02.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>