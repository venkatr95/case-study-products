<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-16 Offline and save error</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-16 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Offline and save error</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<rect x="64" y="156" width="334" height="54" rx="8" fill="#f4efe6" stroke="#8d8376"/>
<text x="76" y="176" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">You are offline. The pantry stays on</text>
<text x="76" y="194" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">this device.</text>
<rect x="64" y="222" width="334" height="54" rx="8" fill="#f4efe6" stroke="#8d8376"/>
<text x="76" y="242" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">This browser blocked saving. The change</text>
<text x="76" y="260" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">is on screen only.</text>
<text x="64" y="288" font-family="Georgia, serif" font-size="24" fill="#1c2822">Pantry</text>
<text x="64" y="324" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Recipe search uses the sample catalog</text>
<text x="64" y="344" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">stored in the app.</text>
<rect x="64" y="372" width="334" height="36" rx="8" fill="#fffcf7" stroke="#cfc6b8"/>
<text x="76" y="396" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Spinach · 200 g · Fridge · Use soon</text>
<text x="64" y="418" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">There is no account to sync. Offline does</text>
<text x="64" y="438" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">not invent a network error for recipes.</text>
<rect x="36" y="860" width="390" height="76" fill="#fffcf7" stroke="#1c2822"/>
<text x="70" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1c2822">Pantry</text>
<text x="162" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Cook</text>
<text x="254" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Shop</text>
<text x="346" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Plan</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. Offline is a status, not a blocker, because</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">the catalog is local.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. A failed save is explained and the previous</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">record is not wiped.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Covers the error and offline states required</text>
<text x="460" y="290" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">by the PRD.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>