<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-15 Unreadable saved data</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-15 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Unreadable saved data</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Saved data could not be</text>
<text x="64" y="186" font-family="Georgia, serif" font-size="24" fill="#1c2822">read</text>
<text x="64" y="222" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">FreshLoop found a saved record and could</text>
<text x="64" y="242" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">not use it. It has not been erased.</text>
<rect x="64" y="270" width="334" height="44" rx="22" fill="#fffcf7" stroke="#1c2822"/>
<text x="231" y="298" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Download the saved text</text>
<rect x="64" y="326" width="334" height="44" rx="22" fill="#fffcf7" stroke="#1c2822"/>
<text x="231" y="354" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Erase and start over</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. Corrupt storage is not silently replaced with</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">an empty pantry.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. The raw text can be downloaded first.</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Erase is a separate action.</text>
<text x="460" y="280" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. Export and delete for readable data live in</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Settings.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>