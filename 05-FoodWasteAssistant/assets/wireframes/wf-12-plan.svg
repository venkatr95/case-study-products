<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-12 Four-day dinner plan</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-12 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Four-day dinner plan</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Four-day dinner plan</text>
<text x="64" y="192" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">A combined list subtracts each pantry</text>
<text x="64" y="212" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">amount once.</text>
<rect x="64" y="240" width="334" height="82" rx="10" fill="#f7f7f5" stroke="#8d8376"/>
<text x="76" y="264" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Thu, Oct 22</text>
<text x="76" y="286" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Spinach and chickpea skillet</text>
<text x="76" y="308" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">2 servings</text>
<rect x="64" y="334" width="334" height="82" rx="10" fill="#f7f7f5" stroke="#8d8376"/>
<text x="76" y="358" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Fri, Oct 23</text>
<text x="76" y="380" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Lemon chicken tray</text>
<text x="76" y="402" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">2 servings</text>
<rect x="64" y="428" width="334" height="36" rx="8" fill="#fffcf7" stroke="#cfc6b8"/>
<text x="76" y="452" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Sat · No dinner planned</text>
<rect x="64" y="474" width="334" height="44" rx="22" fill="#1c2822" stroke="#1c2822"/>
<text x="231" y="502" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fffcf7">Build a shopping list for this plan</text>
<rect x="36" y="860" width="390" height="76" fill="#fffcf7" stroke="#1c2822"/>
<text x="70" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1c2822">Pantry</text>
<text x="162" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Cook</text>
<text x="254" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Shop</text>
<text x="346" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Plan</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. Meal plan is a should-have and is in the</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">prototype.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. Diet-hidden recipes can still be planned,</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">with a visible note.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Building a list opens the same review screen</text>
<text x="460" y="290" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">as a single recipe.</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. Past days drop off the four-day window on the</text>
<text x="460" y="346" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">next visit.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>