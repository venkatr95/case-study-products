<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-04 Add item</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-04 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Add item</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Add item</text>
<text x="64" y="192" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Name</text>
<rect x="64" y="200" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="226" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">Spinach</text>
<text x="64" y="252" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Quantity, optional</text>
<rect x="64" y="260" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="286" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">200</text>
<text x="64" y="312" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Unit</text>
<rect x="64" y="320" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="346" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">g</text>
<text x="64" y="372" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Location</text>
<rect x="64" y="380" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="406" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">Fridge</text>
<text x="64" y="432" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Date type</text>
<rect x="64" y="440" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="466" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">Use-by</text>
<text x="64" y="492" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Date</text>
<rect x="64" y="500" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="526" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">2026-10-23</text>
<text x="64" y="552" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">A blank quantity is allowed. A unit</text>
<text x="64" y="572" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">without a quantity is not.</text>
<rect x="64" y="600" width="334" height="44" rx="22" fill="#1c2822" stroke="#1c2822"/>
<text x="231" y="628" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fffcf7">Save item</text>
<rect x="64" y="656" width="334" height="44" rx="22" fill="#fffcf7" stroke="#1c2822"/>
<text x="231" y="684" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Cancel</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. Name and location are required. Quantity and</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">date are optional.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. Date type is chosen by the person. FreshLoop</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">does not infer one.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Zero is rejected. The app will not assume an</text>
<text x="460" y="290" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">amount.</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. Covers FR-01.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>