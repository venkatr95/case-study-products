<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-08 Recipe detail</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-08 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Recipe detail</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Spinach and chickpea</text>
<text x="64" y="186" font-family="Georgia, serif" font-size="24" fill="#1c2822">skillet</text>
<text x="64" y="222" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">20 min · 2 servings</text>
<rect x="64" y="250" width="334" height="36" rx="8" fill="#fffcf7" stroke="#cfc6b8"/>
<text x="76" y="274" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Spinach · 150 g · Have · Use soon</text>
<rect x="64" y="296" width="334" height="36" rx="8" fill="#fffcf7" stroke="#cfc6b8"/>
<text x="76" y="320" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Cumin · optional · left off</text>
<rect x="64" y="342" width="334" height="36" rx="8" fill="#eceae4" stroke="#1c2822"/>
<text x="76" y="366" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Yogurt oat bowl would say Check, not Have</text>
<rect x="64" y="388" width="334" height="44" rx="22" fill="#1c2822" stroke="#1c2822"/>
<text x="231" y="416" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fffcf7">Shop for what's missing</text>
<rect x="64" y="444" width="334" height="44" rx="22" fill="#fffcf7" stroke="#1c2822"/>
<text x="231" y="472" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">I cooked this</text>
<text x="64" y="500" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">Original sample recipe. Not a licensed</text>
<text x="64" y="520" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">catalog.</text>
<rect x="36" y="860" width="390" height="76" fill="#fffcf7" stroke="#1c2822"/>
<text x="70" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1c2822">Pantry</text>
<text x="162" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Cook</text>
<text x="254" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Shop</text>
<text x="346" y="904" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1c2822">Plan</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. Every ingredient shows a status word: Have,</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Short, Check, Missing, Staple, or Optional.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. A unit mismatch stays on Check. It is not</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">counted as covered.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Servings can change before the list is built.</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. Covers FR-04 and the recipe-detail</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">deliverable.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>