<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-05 Duplicate item</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-05 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Duplicate item</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Spinach is already in</text>
<text x="64" y="186" font-family="Georgia, serif" font-size="24" fill="#1c2822">the fridge</text>
<text x="64" y="222" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">You already have Spinach in the fridge</text>
<text x="64" y="242" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">(200 g).</text>
<rect x="64" y="270" width="334" height="82" rx="10" fill="#f7f7f5" stroke="#8d8376"/>
<text x="76" y="294" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Add to the existing item</text>
<text x="76" y="316" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Save as a separate item</text>
<text x="76" y="338" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Go back</text>
<text x="64" y="364" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">If the units differ, combining is</text>
<text x="64" y="384" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">unavailable. Amounts are not guessed.</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. A same-name, same-location match asks before</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">a second row is saved.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. Another location is mentioned, not blocked.</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Unit mismatches cannot be merged.</text>
<text x="460" y="280" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. Covers the duplicate state in the PRD.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>