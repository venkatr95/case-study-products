<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-14 Barcode confirmation</title>
<rect width="1040" height="980" fill="#f4efe6"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">WF-14 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c2822">Barcode confirmation</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fffcf7" stroke="#1c2822" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#1c2822">FreshLoop</text>
<text x="64" y="156" font-family="Georgia, serif" font-size="24" fill="#1c2822">Add item</text>
<text x="64" y="192" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c2822">Sample barcode</text>
<rect x="64" y="200" width="334" height="40" rx="8" fill="#fffcf7" stroke="#8d8376"/>
<text x="76" y="226" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">000000111111</text>
<rect x="64" y="252" width="334" height="54" rx="8" fill="#f4efe6" stroke="#8d8376"/>
<text x="76" y="272" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">Check this result before saving. It is</text>
<text x="76" y="290" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c2822">not in the pantry yet.</text>
<rect x="64" y="318" width="334" height="82" rx="10" fill="#f7f7f5" stroke="#8d8376"/>
<text x="76" y="342" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Oat milk</text>
<text x="76" y="364" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">1 L · Fridge</text>
<text x="76" y="386" font-family="Segoe UI, sans-serif" font-size="14" fill="#1c2822">Sample result, not a product database</text>
<rect x="64" y="412" width="334" height="44" rx="22" fill="#1c2822" stroke="#1c2822"/>
<text x="231" y="440" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fffcf7">Save item</text>
<rect x="64" y="468" width="334" height="44" rx="22" fill="#fffcf7" stroke="#1c2822"/>
<text x="231" y="496" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">Scan a receipt</text>
<text x="64" y="524" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">Receipt scanning is not connected. There</text>
<text x="64" y="544" font-family="Segoe UI, sans-serif" font-size="14" fill="#24312a">is no OCR provider.</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1c2822">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">1. A lookup never saves by itself. FR-07</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">confirmation is the point.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">2. Unknown codes add nothing.</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">3. Receipt scan is an explicit unavailable</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">state, not a fake capture.</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">4. The codes are illustrative, not real product</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#1c2822">identifiers.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#24312a">Responsive: one column under 960px. Side navigation from 960px. Targets at least 44px.</text>
</svg>