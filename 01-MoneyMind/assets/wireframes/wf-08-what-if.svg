<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-08 What-if scenario</title>
<rect width="1040" height="980" fill="#f7f7f5"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-08 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">What-if scenario</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#111">MoneyMind</text>
<rect x="250" y="112" width="78" height="24" rx="12" fill="#eee" stroke="#999"/>
<text x="262" y="129" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Estimate</text>
<text x="64" y="168" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#333">Not saved</text>
<text x="64" y="196" font-family="Georgia, serif" font-size="26" fill="#111">Try a purchase</text>
<text x="64" y="234" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222">Amount · Date</text>
<rect x="64" y="242" width="334" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="76" y="268" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">Dinner out · 150.00 · Oct 25</text>
<rect x="64" y="294" width="160" height="72" rx="8" fill="#fff" stroke="#999"/>
<rect x="238" y="294" width="160" height="72" rx="8" fill="#f7f7f7" stroke="#111" stroke-dasharray="4 3"/>
<text x="76" y="334" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">Saved · $90.00</text>
<text x="250" y="334" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">Scenario · $0.00</text>
<text x="64" y="380" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">This scenario lowers the lowest estimate.</text>
<text x="64" y="400" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">It is short of the set-aside by $60.00.</text>
<rect x="64" y="428" width="334" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="231" y="456" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">Discard scenario</text>
<rect x="64" y="484" width="334" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="231" y="512" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fff">Add to plan</text>
<rect x="36" y="860" width="390" height="76" fill="#fff" stroke="#222"/>
<text x="78" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Home</text>
<text x="170" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Timeline</text>
<text x="262" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">What-if</text>
<text x="354" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Plan</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Scenario styling is separate from the saved</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">plan.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Discard leaves the baseline untouched.</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Add to plan is explicit. Nothing is saved by</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">typing.</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. A date outside the 30 days is explained, not</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">silently ignored.</text>
<text x="460" y="358" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Covers FR-07.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
</svg>