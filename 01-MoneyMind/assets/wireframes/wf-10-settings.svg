<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Export is the user’s file. Nothing is</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">uploaded.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Delete is confirmed, with Cancel focused</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">first.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Preview links show loading, error, empty, and</text>
<text x="460" y="290" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">offline without changing data.</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Covers privacy and empty/error acceptance.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
