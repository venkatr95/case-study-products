<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-01 Onboarding — estimates, not promises</title>
<rect width="1040" height="980" fill="#f7f7f5"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-01 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Onboarding — estimates, not promises</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#111">MoneyMind</text>
<rect x="250" y="112" width="78" height="24" rx="12" fill="#eee" stroke="#999"/>
<text x="262" y="129" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Estimate</text>
<text x="64" y="168" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#333">Step 1 of 2</text>
<text x="64" y="196" font-family="Georgia, serif" font-size="26" fill="#111">Estimates, not promises</text>
<text x="64" y="234" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">MoneyMind shows whether the cash you enter</text>
<text x="64" y="254" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">is likely to cover the bills you enter</text>
<text x="64" y="274" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">over the next 30 days.</text>
<text x="64" y="302" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">• You type a balance, income, and bills.</text>
<text x="64" y="322" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">Nothing connects to a bank.</text>
<text x="64" y="350" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">• The result is an estimate, not a</text>
<text x="64" y="370" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">guarantee or financial advice.</text>
<text x="64" y="398" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">• Same-day bills are counted before</text>
<text x="64" y="418" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">same-day income.</text>
<text x="64" y="446" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">• Do not enter bank passwords or account</text>
<text x="64" y="466" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">numbers.</text>
<rect x="64" y="494" width="334" height="82" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="76" y="518" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">Lowest estimated balance</text>
<text x="76" y="540" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">− Set-aside you choose</text>
<text x="76" y="562" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">= Safe to spend</text>
<rect x="64" y="588" width="334" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="231" y="616" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fff">Enter what I have now</text>
<rect x="64" y="644" width="334" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="231" y="672" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">Explore with sample data</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Limits and data source come before any</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">number.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. No bank login and no credential field exist.</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Safe to spend is defined before the user is</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">asked for money.</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Sample data is optional and labeled</text>
<text x="460" y="324" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">fictional.</text>
<text x="460" y="358" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Covers FR-03 trust labeling and onboarding</text>
<text x="460" y="380" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">acceptance.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
</svg>