<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-09 Low-balance alert</title>
<rect width="1040" height="980" fill="#f7f7f5"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-09 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Low-balance alert</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#111">MoneyMind</text>
<rect x="250" y="112" width="78" height="24" rx="12" fill="#eee" stroke="#999"/>
<text x="262" y="129" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Estimate</text>
<text x="64" y="168" font-family="Georgia, serif" font-size="26" fill="#111">Low-balance alert</text>
<text x="64" y="206" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">Show an alert when any estimated day goes</text>
<text x="64" y="226" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">below the amount you set.</text>
<rect x="64" y="254" width="334" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="76" y="280" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">Alert below · 250.00 · On</text>
<rect x="64" y="306" width="334" height="54" rx="8" fill="#f3f3f3" stroke="#bbb"/>
<text x="76" y="326" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">The estimate goes below $250.00 on Fri,</text>
<text x="76" y="344" font-family="Segoe UI, sans-serif" font-size="13" fill="#222">Oct 30.</text>
<text x="64" y="372" font-family="Georgia, serif" font-size="26" fill="#111">Device notifications</text>
<text x="64" y="410" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">If blocked, say so. Alerts still appear in</text>
<text x="64" y="430" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">the app. None are sent after the page</text>
<text x="64" y="450" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">closes.</text>
<rect x="64" y="478" width="334" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="231" y="506" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fff">Save alert</text>
<rect x="36" y="860" width="390" height="76" fill="#fff" stroke="#222"/>
<text x="78" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Home</text>
<text x="170" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Timeline</text>
<text x="262" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">What-if</text>
<text x="354" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Plan</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. In-app status does not depend on notification</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">permission.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Denied permission is explained. No fake</text>
<text x="460" y="234" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">scheduled alert.</text>
<text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Copy stays neutral. No shame language.</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Covers FR-06.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
</svg>