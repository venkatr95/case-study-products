<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Covers FR-02 and FR-05 entry.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
