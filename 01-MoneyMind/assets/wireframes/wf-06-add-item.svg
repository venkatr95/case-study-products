<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Invalid amounts are rejected before save.</text>
<text x="460" y="190" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. The preview updates the low point before the</text>
