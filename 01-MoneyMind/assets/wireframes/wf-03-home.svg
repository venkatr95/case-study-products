<text x="262" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">What-if</text>
<text x="354" y="904" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Plan</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. The decision number is first. The low point</text>
<text x="460" y="178" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">is next to it.</text>
<text x="460" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Illustrative sample math, not a user result.</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Disclaimer stays on the decision screen.</text>
<text x="460" y="280" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Primary path continues to the explanation or</text>
<text x="460" y="302" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">a what-if.</text>
<text x="460" y="336" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Covers FR-03 and FR-04 entry.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
