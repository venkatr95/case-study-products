<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="980" viewBox="0 0 1040 980" role="img">
<title>WF-02 Starting balance</title>
<rect width="1040" height="980" fill="#f7f7f5"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-02 · grayscale wireframe · 390 × 844</text>
<text x="36" y="68" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Starting balance</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="128" font-family="Georgia, serif" font-size="20" fill="#111">MoneyMind</text>
<rect x="250" y="112" width="78" height="24" rx="12" fill="#eee" stroke="#999"/>
<text x="262" y="129" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Estimate</text>
<text x="64" y="168" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#333">Step 2 of 2</text>
<text x="64" y="196" font-family="Georgia, serif" font-size="26" fill="#111">What cash is available</text>
<text x="64" y="228" font-family="Georgia, serif" font-size="26" fill="#111">now?</text>
<text x="64" y="266" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">The estimate starts here, before today’s</text>
<text x="64" y="286" font-family="Segoe UI, sans-serif" font-size="14" fill="#222">bills and income.</text>
<text x="64" y="314" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222">Currency symbol</text>
<rect x="64" y="322" width="334" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="76" y="348" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">USD — US dollar</text>
<text x="64" y="374" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222">Current balance</text>
<rect x="64" y="382" width="334" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="76" y="408" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">1840.00</text>
<text x="64" y="434" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222">Balance date</text>
<rect x="64" y="442" width="334" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="76" y="468" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">2026-10-22</text>
<text x="64" y="494" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222">Set-aside</text>
<rect x="64" y="502" width="334" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="76" y="528" font-family="Segoe UI, sans-serif" font-size="14" fill="#333">100.00</text>
<text x="64" y="554" font-family="Segoe UI, sans-serif" font-size="14" fill="#444">Your choice, not a recommendation. Use 0</text>
<text x="64" y="574" font-family="Segoe UI, sans-serif" font-size="14" fill="#444">for no cushion.</text>
<rect x="64" y="602" width="334" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="231" y="630" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#fff">Create my estimate</text>
<text x="460" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="460" y="156" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. One cash pool. No account aggregation.</text>
<text x="460" y="190" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Future balance dates are rejected.</text>
<text x="460" y="224" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Set-aside defaults to an explicit choice,</text>
<text x="460" y="246" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">including zero.</text>
<text x="460" y="280" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Currency is a symbol only. No conversion.</text>
<text x="460" y="314" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Covers FR-01.</text>
<text x="460" y="930" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: single column under 880px. Side navigation at 880px and wider. Touch targets 44px.</text>
</svg>