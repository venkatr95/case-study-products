<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Source and date are on the profile, not in a</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">footnote. FR-01.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Core and supporting are words, not weights.</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Edit lets a person hide or add a requirement.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">FR-03 stays editable.</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Screen S-03. Edit is S-04.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
