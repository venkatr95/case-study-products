<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="994" viewBox="0 0 1120 994" role="img">
<title>WF-13 Settings and deletion</title>
<rect width="1120" height="994" fill="#f4f4f1"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-13 · grayscale wireframe · 390 × 844</text>
<text x="36" y="72" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Settings and deletion</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="124" font-family="Georgia, serif" font-size="16" fill="#111">SkillBridge</text>
<text x="56" y="168" font-family="Georgia, serif" font-size="24" fill="#111">Settings and your data</text>
<text x="56" y="204" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">SkillBridge stores this profile in this</text>
<text x="56" y="224" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">browser only. It does not keep pasted</text>
<text x="56" y="244" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">resume text.</text>
<text x="56" y="270" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Name on this profile</text>
<rect x="56" y="278" width="340" height="40" rx="8" fill="#fff" stroke="#999"/>
<text x="68" y="304" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">Maya Chen</text>
<rect x="56" y="334" width="340" height="118" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="358" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">What is saved</text>
<text x="68" y="378" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">7 skills you entered or confirmed.</text>
<text x="68" y="398" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">3 roadmap actions.</text>
<text x="68" y="418" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">This profile started as Maya's fictional</text>
<text x="68" y="438" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">sample.</text>
<rect x="56" y="464" width="340" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="226" y="492" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111" text-anchor="middle">Copy saved data</text>
<rect x="56" y="520" width="340" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="226" y="548" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Delete saved data on this browser</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Collection is explained in place.</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Delete is permanent and confirmed in a</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">dialog.</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. A copy is offered before deletion. The paste</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">is absent from it.</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Reset sample is separate from deleting a real</text><text x="470" y="282" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">profile.</text><text x="470" y="304" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Screen S-14.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>