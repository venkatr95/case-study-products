<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="994" viewBox="0 0 1120 994" role="img">
<title>WF-15 Saved data cannot be read</title>
<rect width="1120" height="994" fill="#f4f4f1"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-15 · grayscale wireframe · 390 × 844</text>
<text x="36" y="72" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Saved data cannot be read</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="124" font-family="Georgia, serif" font-size="16" fill="#111">SkillBridge</text>
<text x="56" y="168" font-family="Georgia, serif" font-size="24" fill="#111">Saved data could not be read</text>
<text x="56" y="204" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">This browser has saved data SkillBridge</text>
<text x="56" y="224" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">cannot use.</text>
<text x="56" y="250" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">Your previous data is still in this</text>
<text x="56" y="270" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">browser. Clearing it is permanent.</text>
<text x="56" y="290" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">SkillBridge will not overwrite it unless</text>
<text x="56" y="310" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">you ask.</text>
<rect x="56" y="336" width="340" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="226" y="364" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Delete the unreadable data and start over</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Corrupt data is not silently replaced.</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. The only write is an explicit delete.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Offline work still uses readable saved data.</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">A banner covers offline separately.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Screen S-15. Not-found is S-16.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>