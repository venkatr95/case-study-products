<text x="68" y="250" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Guidance, not a hiring prediction</text>
<text x="68" y="270" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">This compares what you entered with a</text>
<text x="68" y="290" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">role profile.</text>
<text x="68" y="310" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">There is no match score.</text>
<text x="56" y="336" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">You listed 7 skills. 1 matches this</text>
<text x="56" y="356" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">profile and 2 are partial. 4 skills you</text>
<text x="56" y="376" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">listed are not in this profile, and they</text>
<text x="56" y="396" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">still count.</text>
<text x="56" y="422" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Of 6 core skills: 0 matched, 2 partial, 4 not in</text>
<text x="56" y="440" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">your list yet.</text>
<rect x="56" y="464" width="39" height="26" rx="13" fill="#eee" stroke="#999"/>
<text x="65" y="482" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="start">All</text>
<rect x="103" y="464" width="46" height="26" rx="13" fill="#eee" stroke="#999"/>
<text x="112" y="482" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="start">Core</text>
