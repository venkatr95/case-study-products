<text x="68" y="568" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">You have not added this skill.</text>
<text x="68" y="588" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">See why and what to do</text>
<rect x="56" y="614" width="340" height="78" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="638" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Customer conversations</text>
