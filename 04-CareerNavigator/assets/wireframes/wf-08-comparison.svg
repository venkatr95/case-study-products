<text x="68" y="678" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">You marked strong, confidence high.</text>
<rect x="56" y="704" width="340" height="78" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="728" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">In your list, not in this profile</text>
<text x="68" y="748" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Scheduling · Comfortable. These still</text>
<text x="68" y="768" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">count.</text>
<rect x="56" y="794" width="340" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="226" y="822" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Review a small plan</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Counts are sentences. There is no percentage.</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">FR-03 and the guardrail.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Matched, partial, and missing use words plus</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">a mark, not color alone.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Skills outside the profile are framed as</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">experience, not failures.</text><text x="470" y="282" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. An empty skill list does not render a wall of</text><text x="470" y="304" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">gaps. See WF-14.</text><text x="470" y="326" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Screen S-09.</text>
<text x="36" y="1000" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>