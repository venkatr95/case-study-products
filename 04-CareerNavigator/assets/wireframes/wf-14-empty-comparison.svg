<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="994" viewBox="0 0 1120 994" role="img">
<title>WF-14 Empty skill list is not a gap report</title>
<rect width="1120" height="994" fill="#f4f4f1"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-14 · grayscale wireframe · 390 × 844</text>
<text x="36" y="72" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Empty skill list is not a gap report</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="124" font-family="Georgia, serif" font-size="16" fill="#111">SkillBridge</text>
<text x="56" y="168" font-family="Georgia, serif" font-size="24" fill="#111">Comparison</text>
<rect x="56" y="204" width="340" height="38" rx="10" fill="#f3f3f1" stroke="#999"/>
<text x="68" y="228" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Guidance, not a hiring prediction</text>
<rect x="56" y="254" width="340" height="78" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="278" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Your skill list is empty</text>
<text x="68" y="298" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Add the skills you already use. An empty</text>
<text x="68" y="318" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">list is not a gap report.</text>
<rect x="56" y="344" width="340" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="226" y="372" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Add a skill</text>
<rect x="56" y="400" width="340" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="226" y="428" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111" text-anchor="middle">Paste resume text</text>
<text x="56" y="456" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">This profile includes</text>
<text x="56" y="482" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Stakeholder updates (core)</text>
<text x="56" y="506" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Requirements briefs (core)</text>
<text x="56" y="530" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Spreadsheets (core)</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. Missing chips are withheld until the person</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">has claimed at least one skill.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. The profile is still visible, without a</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">verdict.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. This is the main defense against the</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">comparison feeling like a judgment.</text><text x="470" y="282" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Variant of screen S-09.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>