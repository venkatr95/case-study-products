<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="994" viewBox="0 0 1120 994" role="img">
<title>WF-04 Skills inventory</title>
<rect width="1120" height="994" fill="#f4f4f1"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-04 · grayscale wireframe · 390 × 844</text>
<text x="36" y="72" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Skills inventory</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="124" font-family="Georgia, serif" font-size="16" fill="#111">SkillBridge</text>
<text x="56" y="168" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">Step 2 · Skills you already have</text>
<text x="56" y="190" font-family="Georgia, serif" font-size="24" fill="#111">Your skills</text>
<text x="56" y="226" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">Proficiency and confidence are</text>
<text x="56" y="246" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">self-assessments. You can revise or remove</text>
<text x="56" y="266" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">either.</text>
<rect x="56" y="292" width="340" height="178" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="316" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Scheduling</text>
<text x="68" y="336" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Comfortable. I do the routine work.</text>
<text x="68" y="356" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Confidence: High. I can point to recent</text>
<text x="68" y="376" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">work.</text>
<text x="68" y="396" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Example: I build the weekly floor</text>
<text x="68" y="416" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">schedule.</text>
<text x="68" y="436" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">You entered this.</text>
<text x="68" y="456" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Edit Remove</text>
<rect x="56" y="482" width="340" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="226" y="510" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Add a skill</text>
<rect x="56" y="538" width="340" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="226" y="566" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111" text-anchor="middle">Paste resume text</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. The list leads with what the person already</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">claims. FR-02.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Confidence is separate from proficiency, so a</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">guess is not treated as a match.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Resume import is optional and secondary.</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. Remove is available on every skill.</text><text x="470" y="282" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Screen S-05.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>