<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="994" viewBox="0 0 1120 994" role="img">
<title>WF-10 Three-action roadmap</title>
<rect width="1120" height="994" fill="#f4f4f1"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-10 · grayscale wireframe · 390 × 844</text>
<text x="36" y="72" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Three-action roadmap</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="124" font-family="Georgia, serif" font-size="16" fill="#111">SkillBridge</text>
<text x="56" y="168" font-family="Georgia, serif" font-size="24" fill="#111">A small plan</text>
<rect x="56" y="204" width="340" height="98" rx="10" fill="#f3f3f1" stroke="#999"/>
<text x="68" y="228" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Guidance, not a hiring prediction</text>
<text x="68" y="248" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">None of the core skills are matched yet.</text>
<text x="68" y="268" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Check the comparison before you treat</text>
<text x="68" y="288" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">these as gaps.</text>
<text x="56" y="314" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">The first plan is three actions. You can</text>
<text x="56" y="334" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">edit, remove, or add more.</text>
<rect x="56" y="360" width="340" height="118" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="384" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">1 Write one stakeholder update</text>
<text x="68" y="404" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Not started</text>
<text x="68" y="424" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">A person who was not in the room can see</text>
<text x="68" y="444" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">what changed.</text>
<text x="68" y="464" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Open action</text>
<rect x="56" y="490" width="340" height="58" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="514" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">2 Turn one request into a one-page brief</text>
<text x="68" y="534" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Not started</text>
<rect x="56" y="560" width="340" height="58" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="584" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">3 Map one workflow you already know</text>
<text x="68" y="604" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Not started</text>
<rect x="56" y="630" width="340" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="226" y="658" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111" text-anchor="middle">Add my own action</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. The first plan is capped at three so it does</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">not become a curriculum. FR-04.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. Matched skills are acknowledged before the</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">gaps.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Actions are editable and removable.</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. More gaps can be added later. They are not</text><text x="470" y="282" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">dumped at once.</text><text x="470" y="304" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Screen S-11.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>