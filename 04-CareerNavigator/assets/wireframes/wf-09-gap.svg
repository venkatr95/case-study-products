<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="994" viewBox="0 0 1120 994" role="img">
<title>WF-09 Why a gap matters</title>
<rect width="1120" height="994" fill="#f4f4f1"/>
<text x="36" y="42" font-family="Segoe UI, sans-serif" font-size="14" fill="#555">WF-09 · grayscale wireframe · 390 × 844</text>
<text x="36" y="72" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1c1c1c">Why a gap matters</text>
<rect x="36" y="92" width="390" height="844" rx="28" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="64" y="124" font-family="Georgia, serif" font-size="16" fill="#111">SkillBridge</text>
<text x="56" y="168" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#333" text-anchor="start">Product operations associate</text>
<text x="56" y="190" font-family="Georgia, serif" font-size="24" fill="#111">Stakeholder updates</text>
<rect x="56" y="226" width="130" height="26" rx="13" fill="#eee" stroke="#999"/>
<text x="65" y="244" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="start">Not in your list</text>
<text x="56" y="266" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">This skill is not in your list yet. Add it</text>
<text x="56" y="286" font-family="Segoe UI, sans-serif" font-size="14" font-weight="400" fill="#222" text-anchor="start">if you already do it.</text>
<rect x="56" y="312" width="340" height="78" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="336" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Why it is in the profile</text>
<text x="68" y="356" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">The work breaks when people who depend</text>
<text x="68" y="376" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">on a handoff do not hear what changed.</text>
<rect x="56" y="402" width="340" height="78" rx="10" fill="#fff" stroke="#999"/>
<text x="68" y="426" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">A small way to practice</text>
<text x="68" y="446" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Write one five-line update: status,</text>
<text x="68" y="466" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">change, blocker, ask, next check-in.</text>
<rect x="56" y="492" width="340" height="44" rx="22" fill="#222" stroke="#222"/>
<text x="226" y="520" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Add this skill</text>
<rect x="56" y="548" width="340" height="44" rx="22" fill="#fff" stroke="#222"/>
<text x="226" y="576" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111" text-anchor="middle">Add a learning action</text>
<text x="56" y="604" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">This is not part of the role I mean</text>
<text x="470" y="120" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#111">Annotations</text>
<text x="470" y="150" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">1. The status definition is repeated so the</text><text x="470" y="172" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">label is not a grade.</text><text x="470" y="194" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">2. The person can add the skill if the profile</text><text x="470" y="216" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">is wrong about them. FR-02, FR-03.</text><text x="470" y="238" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">3. Hiding a requirement is allowed when the role</text><text x="470" y="260" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">they mean is different.</text><text x="470" y="282" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">4. The practice step is one sitting, not a</text><text x="470" y="304" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">course. FR-04.</text><text x="470" y="326" font-family="Segoe UI, sans-serif" font-size="15" fill="#222">5. Screen S-10.</text>
<text x="36" y="966" font-family="Segoe UI, sans-serif" font-size="13" fill="#555">Responsive: one column under 720px. Primary navigation wraps. Touch targets are 44px. No match-score graphic.</text>
</svg>